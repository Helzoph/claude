# dev-env-router: project-level compose template (one per project / git worktree)
#
# Local development only (plain HTTP, no TLS). Never use this file as a reference for production deployment config.
#
# Prerequisite: the shared router is already running on the host (see router/router-compose.yml in the plugin directory,
# set up once manually by the user per USAGE.md), and `docker network create web` has already been run.
#
# Identity source: when COMPOSE_PROJECT_NAME is not set explicitly, Docker Compose uses the current directory name
# as the project name by default, from which a unique domain http://<dir-name>.localhost is derived — no need to assign ports/domains by hand.
#
# Note: Compose normalizes the directory name (lowercase, replace illegal characters);
# if the directory name contains uppercase letters, dots, or similar characters, the generated domain may not exactly match the directory name.
# Treat the actual route shown by `docker compose config` or the router dashboard (see skills/operate/SKILL.md) as authoritative.

services:
  # TODO: replace with the project's actual service definitions (one or more services).
  app:
    # TODO: fill in for the project's stack, e.g.:
    #   build: .
    # or:
    #   image: node:20
    #   command: npm run dev
    build: .
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${COMPOSE_PROJECT_NAME}.localhost`)
      # TODO: change 80 to the port the service actually listens on inside the container (e.g. Vite defaults to 5173, Express commonly uses 3000)
      - traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=80
    # Rationale: do not publish ports to the host — all access is forwarded through the shared Traefik,
    # so ports are no longer visible to users and cannot conflict with other projects/worktrees.

networks:
  web:
    external: true
