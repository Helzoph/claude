name: Sync Emil Design Skills

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: sync-emil-design-skills
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this marketplace
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out upstream skills
        uses: actions/checkout@v4
        with:
          repository: emilkowalski/skills
          ref: main
          path: .upstream-emil-skills
          fetch-depth: 1

      - name: Synchronize skill files
        run: python3 .github/scripts/sync-emil-design-skills.py --source .upstream-emil-skills

      - name: Validate synchronized files
        run: |
          python3 -m json.tool plugins/emil-design-skills/.claude-plugin/plugin.json >/dev/null
          python3 -m json.tool plugins/emil-design-skills/.codex-plugin/plugin.json >/dev/null
          python3 -m json.tool .claude-plugin/marketplace.json >/dev/null
          test "$(find plugins/emil-design-skills/skills -mindepth 1 -maxdepth 1 -type d | wc -l)" -gt 0
          test "$(find plugins/emil-design-skills/skills -mindepth 2 -maxdepth 2 -type f -name SKILL.md | wc -l)" -gt 0

      - name: Prepare synchronization branch
        id: changes
        env:
          SYNC_BRANCH: automation/sync-emil-design-skills
        run: |
          if git diff --quiet -- plugins/emil-design-skills/skills plugins/emil-design-skills/LICENSE plugins/emil-design-skills/.claude-plugin/plugin.json plugins/emil-design-skills/.codex-plugin/plugin.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$SYNC_BRANCH"
          git add plugins/emil-design-skills/skills plugins/emil-design-skills/LICENSE plugins/emil-design-skills/.claude-plugin/plugin.json plugins/emil-design-skills/.codex-plugin/plugin.json
          git commit -m "chore: sync Emil design skills"
          git push --force origin "HEAD:$SYNC_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create or update synchronization PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_BRANCH: automation/sync-emil-design-skills
        run: |
          cat > "$RUNNER_TEMP/emil-sync-pr-body.md" <<'EOF'
          This PR was generated by `.github/workflows/sync-emil-design-skills.yml`.

          It synchronizes `plugins/emil-design-skills/` from:
          https://github.com/emilkowalski/skills/tree/main

          Please review upstream changes before merging.
          EOF

          pr_number="$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number')"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --body-file "$RUNNER_TEMP/emil-sync-pr-body.md"
          else
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$SYNC_BRANCH" \
              --title "chore: sync Emil design skills" \
              --body-file "$RUNNER_TEMP/emil-sync-pr-body.md"
          fi
